site_name: SW Docs
site_url: http://abotw.github.io/docs-sw
repo_url: https://github.com/abotw/docs-sw

theme:
  name: material
  palette:
    primary: green 
  features:
    - content.code.copy
    - search.suggest
    - search.highlight

extra:
  status:
    done: Done

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - typeset

extra_css:
  - stylesheets/extra.css